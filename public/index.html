<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemini Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
 
<body>
    <div class="container">
        <header>
            <h1>Gemini Agent</h1>
        </header>

        <main>
            <div id="visualizer-container">
                <div id="visualizer">
                    <img id="orb-img" src="orb.png" alt="AI Orb">
                </div>
                <div id="orb-status"></div>
            </div>

            <div id="controls">
                <button id="mic-button" aria-label="Start Voice Input">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button id="mute-button" title="Mute voice" aria-label="Toggle voice output">🔊</button>
            </div>

            <div id="text-input-row">
                <input id="text-input" type="text" placeholder="Or type a message…" autocomplete="off" aria-label="Type your message">
                <button id="send-button" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            
            <div id="output" class="status-text"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
