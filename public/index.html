<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-200 via-purple-200 to-pink-200 min-h-screen flex items-center justify-center">

    <div class="bg-white rounded-xl shadow-lg p-8 max-w-lg w-full">
        <h1 class="text-3xl font-bold text-center text-purple-700 mb-4">Gemini AI Chatbot</h1>

        <div id="chat-window" class="bg-gray-100 rounded-lg h-64 overflow-y-auto p-4 mb-4">
            <p class="text-sm text-gray-400 text-center">Start the conversation...</p>
        </div>

        <form id="chat-form" class="flex">
            <input type="text" id="user-input"
                class="flex-grow border border-purple-300 rounded-l-lg p-2 focus:outline-none focus:ring-2 focus:ring-purple-400"
                placeholder="Type your message..." required>
            <button type="submit"
                class="bg-purple-500 text-white px-4 rounded-r-lg hover:bg-purple-600 transition">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = userInput.value.trim();
            if (!message) return;

            // Add user's message to chat
            addMessage('You', message);

            // Clear input
            userInput.value = '';

            // Show loading message
            const loadingId = addMessage('Gemini', 'Thinking...');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();
                updateMessage(loadingId, 'Gemini', data.response);
            } catch (err) {
                updateMessage(loadingId, 'Gemini', 'Sorry, an error occurred.');
                console.error(err);
            }
        });

        function addMessage(sender, text) {
            const msgId = `msg-${Date.now()}`;
            const msgDiv = document.createElement('div');
            msgDiv.id = msgId;
            msgDiv.className = `mb-2 p-2 rounded ${sender === 'You' ? 'bg-purple-100 self-end' : 'bg-blue-100 self-start'}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgId;
        }

        function updateMessage(id, sender, text) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            }
        }
    </script>

</body>

</html>
